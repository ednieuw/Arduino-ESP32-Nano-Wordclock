# Home Assistant dashboard cards for the WordClock / Fibonacci clock (device: ESPRedPCB)
# ---------------------------------------------------------------
# Paste into a dashboard: Edit dashboard -> + Add card -> Manual -> paste -> Save.
#
# The entity ids below assume the clock's BLE name is "ESPRedPCB" (device id: espredpcb).
# If your clock has another name, replace "espredpcb" everywhere, or look the ids up in
# Settings -> Devices & Services -> MQTT -> ESPRedPCB (click an entity to see its id).

# ---- Card 1: all controls -------------------------------------
type: entities
title: ESPRedPCB
show_header_toggle: false
entities:
  - entity: switch.espredpcb_display
    name: Display
    icon: mdi:clock-digital
  - entity: number.espredpcb_max_brightness
    name: Max brightness
    icon: mdi:brightness-6
  - entity: select.espredpcb_display_colour_scheme
    name: Colour scheme
    icon: mdi:palette
  - entity: select.espredpcb_random_display
    name: Random display
    icon: mdi:shuffle-variant
  - type: divider
  - entity: button.espredpcb_led_test
    name: LED test
    icon: mdi:led-on
  - entity: button.espredpcb_statusled_on_off
    name: Status LEDs on/off
    icon: mdi:led-outline
  - entity: button.espredpcb_restart
    name: Restart clock
    icon: mdi:restart

